<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Practice Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 25px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        img {
            width: 200px;
            border-radius: 10px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a148c;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Practice Website</h1>
        <p>Learning HTML, CSS and JavaScript</p>
    </header>

    <div class="container">

        <h2>About Me</h2>

        <p>
            Hello! I am learning web development.
            This is my HTML practice page.
        </p>

        <img src="https://via.placeholder.com/200" alt="Practice Image">

        <h3>My Skills</h3>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Java</li>
            <li>Python</li>
        </ul>

        <br>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "You clicked the button!";
        }
    </script>

</body>
</html>
