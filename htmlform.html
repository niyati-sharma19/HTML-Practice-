<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Registration Form</title>
</head>
<body>

    <form>
        <h2>University Registration Form</h2>
        <p>Please fill out the form below to register.</p>
        <hr>

        <h3>Personal Details</h3>

        <label for="firstname">First Name:</label>
        <input type="text" id="firstname"
               placeholder="e.g. Ram, Rohan" required>
        <br><br>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname"
               placeholder="e.g. Sharma, Tyagi, Dhiman" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <h3>Gender</h3>

        <input type="radio" name="gender" id="male" value="Male">
        <label for="male">Male</label>
        <br>

        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
        <br>

        <input type="radio" name="gender" id="other" value="Other">
        <label for="other">Other</label>
        <br><br>

        <h3>Upload Your Photo</h3>
        <input type="file" name="photo">
        <br><br>
        <hr>
        <h3>Contact Information</h3> 
        <br><br>
        <label>Email Address :</label>
        <input type="text" placeholder =
        " you@example.com">
        <br><br>
        <label>Phone Number :</label>
        <input type=" text" placeholder ="e.g 9837382920">
        <br><br>
        <label id = "Address"> Mailing Address :</label>
        <input type="text" row = "10"col = "15" id="Address" placeholder ="Street Address ,city ,state,ZIP code">
        <hr>
        <h3>Academic Information </h3>
        <select name=" Course">
            <option value ="BCA">BCA</option>
            <option value="B.TECH">B.TECH</option>
            <option value="BA">BA</option>
        </select>
        <h4>Extracurricular Interests :</h4>
        <br><br>
        <input type="checkbox" value="Sports">
        <label>Sports</label>
        <br><br>

       <input type="checkbox" value="Music & Arts">
       <label>Music & Arts</label>
        <br><br>

        <input type="checkbox" value="Technology Clubs">
        <label>Technology Clubs</label>
        <br><br>

       <input type="checkbox" value="Volunteering">
        <label>Volunteering</label>

        <hr>
        <h4>Create Your Account</h4>
        <label>Create Password</label>
        <input type ="password" >
        <br> <br>
        <label>Security Question </label>
        <select name =" query">
            <option value="query" >How is my personal data stored and protected?</option>
            <option value =" query"> Do you support multi-factor authentication (MFA)?</option>
            <option value ="query"> What happens if I forget my password—how secure is the reset process</option>

        </select>
        <label> Security Answer </label>
        <input type =" text ">
        <br><br> 
        <input type ="checkbox" >
        <label> I agree to the Term and Conditions</label>
        <br><br>
        <input type="submit" value="Register">

    </form>

</body>
</html>
