<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <style>
        /* --- Reset & Base Layout --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .game-container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .instructions {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* --- Scoreboard Styles --- */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #334155;
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .score-number {
            font-size: 2rem;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 0.25rem;
        }

        /* --- Choice Button Layout --- */
        .choices-container {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .choice-btn {
            background: transparent;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            font-size: 2.5rem;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .choice-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        /* --- Live Results Display --- */
        .results-display {
            background: #0f172a;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.75rem;
        }

        .matchup {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        .matchup span {
            font-weight: 600;
            color: #f1f5f9;
        }

        .verdict {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 0.25rem;
        }

        /* Dynamic classes injected by JS for win/loss colors */
        .text-win { color: #4ade80; }
        .text-lose { color: #f87171; }
        .text-draw { color: #e2e8f0; }

    </style>
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        <p class="instructions">First to 5 points wins the match!</p>

        <div class="scoreboard">
            <div class="score-box">
                <span class="score-label">Player</span>
                <span id="player-score" class="score-number">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Computer</span>
                <span id="computer-score" class="score-number">0</span>
            </div>
        </div>

        <div class="choices-container">
            <button class="choice-btn" onclick="playTurn('✊')">✊</button>
            <button class="choice-btn" onclick="playTurn('✋')">✋</button>
            <button class="choice-btn" onclick="playTurn('✌️')">✌️</button>
        </div>

        <div class="results-display">
            <div id="game-matchup" class="matchup">Make your move to start the game!</div>
            <div id="game-verdict" class="verdict"></div>
        </div>
    </div>

    <script>
        // Track the current score states
        let playerScore = 0;
        let computerScore = 0;

        // Elements we need to update dynamically
        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');
        const matchupEl = document.getElementById('game-matchup');
        const verdictEl = document.getElementById('game-verdict');

        function playTurn(playerChoice) {
            // 1. Guard check to see if the game has already concluded
            if (playerScore >= 5 || computerScore >= 5) {
                return; 
            }

            // 2. Generate computer random selection
            const choices = ['✊', '✋', '✌️'];
            const randomIndex = Math.floor(Math.random() * 3);
            const computerChoice = choices[randomIndex];

            // Update matchup window text
            matchupEl.innerHTML = `You chose <span>${playerChoice}</span> vs Computer chose <span>${computerChoice}</span>`;

            // 3. Game logic evaluation rules
            if (playerChoice === computerChoice) {
                displayRoundResult("It's a tie!", "text-draw");
            } 
            else if (
                (playerChoice === '✊' && computerChoice === '✌️') ||
                (playerChoice === '✋' && computerChoice === '✊') ||
                (playerChoice === '✌️' && computerChoice === '✋')
            ) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                displayRoundResult("You win this round! 🎉", "text-win");
            } 
            else {
                computerScore++;
                computerScoreEl.textContent = computerScore;
                displayRoundResult("Computer wins this round. 😢", "text-lose");
            }

            // 4. Check for absolute match termination criteria
            checkMatchOver();
        }

        function displayRoundResult(message, cssClass) {
            verdictEl.textContent = message;
            // Clear prior verdict color layouts
            verdictEl.className = "verdict " + cssClass;
        }

        function checkMatchOver() {
            if (playerScore === 5) {
                verdictEl.textContent = "🏆 CONGRATULATIONS! YOU WON THE MATCH!";
                verdictEl.className = "verdict text-win";
                matchupEl.textContent = "Refresh page to reset and play again.";
            } else if (computerScore === 5) {
                verdictEl.textContent = "🤖 GAME OVER! COMPUTER WINS THE MATCH!";
                verdictEl.className = "verdict text-lose";
                matchupEl.textContent = "Refresh page to reset and play again.";
            }
        }
    </script>

</body>
</html>
