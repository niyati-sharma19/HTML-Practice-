<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Memory Card Game</title>
    <style>
        /* --- Reset & Layout --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        .stats {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        /* --- Game Grid Layout --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            perspective: 1000px; /* Crucial for 3D depth effect */
        }

        /* --- The Card Structure (3D Flip Logic) --- */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d; /* Tells child elements to stay in 3D space */
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        /* When the 'flipped' class is added by JS, rotate the card container */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Front and Back common styling */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back side when turned away */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* Blue card back facing the user initially */
        .card-back {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            color: #38bdf8;
        }

        /* Card front containing the hidden emoji */
        .card-front {
            background-color: #334155;
            border: 2px solid #475569;
            transform: rotateY(180deg); /* Pre-rotated so it faces backwards initially */
        }

        /* Win Message Display */
        .win-message {
            display: none;
            color: #4ade80;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 1.5rem;
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <h1>Memory Match</h1>
    <div class="stats">Moves: <span id="moves-count">0</span></div>

    <div class="game-grid" id="grid"></div>

    <div class="win-message" id="win-text">🏆 Incredible! You matched them all!</div>

    <script>
        // 1. Setup the Game Items (8 pairs of emojis = 16 cards total)
        const items = ['💻', '💻', '🚀', '🚀', '🦊', '🦊', '🎨', '🎨', '🍕', '🍕', '🎮', '🎮', '💡', '💡', '🎵', '🎵'];
        
        // State variables to track choices and lock active inputs
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false; 
        let moves = 0;
        let matchedCount = 0;

        const grid = document.getElementById('grid');
        const movesEl = document.getElementById('moves-count');
        const winText = document.getElementById('win-text');

        // 2. Shuffle Array (Fisher-Yates Shuffle Algorithm)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 3. Render Cards dynamically inside the Grid Layout
        function initGame() {
            shuffle(items);
            items.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                // Store the emoji name as a custom data attribute to check matches later
                card.dataset.icon = emoji; 

                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        // 4. Handle Card Selection Click Actions
        function flipCard() {
            if (lockBoard) return; // Prevent clicks if two cards are currently being compared
            if (this === firstCard) return; // Prevent clicking the exact same card twice

            this.classList.add('flipped');

            if (!firstCard) {
                // First card selected
                firstCard = this;
                return;
            }

            // Second card selected
            secondCard = this;
            moves++;
            movesEl.textContent = moves;

            checkForMatch();
        }

        // 5. Comparison Logic
        function checkForMatch() {
            const isMatch = firstCard.dataset.icon === secondCard.dataset.icon;
            
            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        // Keep matching cards flipped and clear selections
        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matchedCount += 2;
            if(matchedCount === items.length) {
                winText.style.display = 'block';
            }
            
            resetBoardState();
        }

        // Unflip cards back over if they don't match
        function unflipCards() {
            lockBoard = true; // Lock input so user can't click third/fourth cards instantly

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoardState();
            }, 1000); // Wait 1 second before flipping back so user can memorize them
        }

        // Reset variables for the next turn
        function resetBoardState() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        // Execute initialization on page load
        initGame();
    </script>

</body>
</html>

    <title>Advanced 3D Memory Card Game</title>
    <style>

        * {

        }

        /* Dynamic grid configurations managed via JS */
        .grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
            max-width: 460px;
        }

        .grid-6x4 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 680px;
        }

        /* --- The Card Structure (3D Flip Logic) --- */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

            position: absolute;
            width: 100%;
            height: 100%;

            border-radius: 10px;

            justify-content: center;

        }

<body>

    <header>
        <h1>Memory Space</h1>
    </header>

    <div class="stats-panel">
        <div>Level: <span id="level-display" class="highlight">1</span></div>
        <div>Moves: <span id="moves-display" class="highlight">0</span></div>
    </div>

    <div class="game-grid grid-4x4" id="grid"></div>

    <div class="modal" id="level-modal">
        <div class="modal-content">
            <h2 id="modal-title">Level Cleared!</h2>
            <p id="modal-desc">Get ready for a bigger challenge grid.</p>
            <button id="modal-btn" onclick="advanceGame()">Next Level</button>
        </div>
    </div>

    <script>
        // 1. Emojis for different levels
        const level1Items = ['💻', '💻', '🚀', '🚀', '🦊', '🦊', '🎨', '🎨', '🍕', '🍕', '🎮', '🎮', '💡', '💡', '🎵', '🎵']; // 16 items
        const level2Items = [...level1Items, '👑', '👑', '🪐', '🪐', '💎', '💎', '🔥', '🔥']; // 24 items

        // 2. Sound Effects Engine (Synthesized Audio)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            // Resume context if browser suspended it
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'match') {
                // Success: Quick cheerful two-tone chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } 
            else if (type === 'miss') {
                // Failure: Low buzzing slide down
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
            else if (type === 'win') {
                // Win: Upward celebratory arpeggio
                const tones = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                tones.forEach((freq, index) => {
                    const partialOsc = audioCtx.createOscillator();
                    const partialGain = audioCtx.createGain();
                    partialOsc.type = 'sine';
                    partialOsc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
                    partialGain.gain.setValueAtTime(0.15, audioCtx.currentTime + (index * 0.1));
                    partialGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.3);
                    partialOsc.connect(partialGain);
                    partialGain.connect(audioCtx.destination);
                    partialOsc.start(audioCtx.currentTime + (index * 0.1));
                    partialOsc.stop(audioCtx.currentTime + (index * 0.1) + 0.3);
                });
            }
        }

        // 3. Dynamic Background Color Changer
        function updateBackgroundColor() {
            // Generates a random color with a very dark background layer (HSL model keeps it soft/dark)
            const randomHue = Math.floor(Math.random() * 360);
            document.body.style.backgroundColor = `hsl(${randomHue}, 40%, 10%)`;
        }

        // 4. Game Configuration Variables
        let currentLevel = 1;
        let activeItems = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let moves = 0;
        let matchedPairsCount = 0;

        const gridEl = document.getElementById('grid');
        const levelDisplay = document.getElementById('level-display');
        const movesDisplay = document.getElementById('moves-display');
        const modal = document.getElementById('level-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalBtn = document.getElementById('modal-btn');

        // Shuffling Engine
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 5. Build/Rebuild Game Interface
        function buildGameMap() {
            gridEl.innerHTML = ""; // Clear existing grid cards
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            moves = 0;
            matchedPairsCount = 0;
            movesDisplay.textContent = moves;
            levelDisplay.textContent = currentLevel;

            // Configure layout dimensions depending on level challenge rules
            if (currentLevel === 1) {
                gridEl.className = "game-grid grid-4x4";
                activeItems = shuffle([...level1Items]);
            } else {
                gridEl.className = "game-grid grid-6x4";
                activeItems = shuffle([...level2Items]);
            }

            // Append cards to DOM
            activeItems.forEach(emoji => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = emoji;

                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div
