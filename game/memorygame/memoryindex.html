<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a wam</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    color:white;
    padding:20px;
    transition:background 0.8s ease;
}

header{
    text-align:center;
    margin-bottom:20px;
}

h1{
    color:#38bdf8;
    font-size:2.8rem;
    margin-bottom:8px;
}

header p{
    color:#cbd5e1;
}

.stats-panel{
    display:flex;
    gap:30px;
    margin-bottom:25px;
    background:rgba(255,255,255,0.1);
    padding:15px 30px;
    border-radius:50px;
    backdrop-filter:blur(10px);
}

.highlight{
    color:#38bdf8;
    font-weight:bold;
}

.game-grid{
    display:grid;
    gap:15px;
    perspective:1000px;
}

.grid-4x4{
    grid-template-columns:repeat(4,100px);
}

.grid-6x4{
    grid-template-columns:repeat(6,90px);
}

.card{
    width:90px;
    height:90px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.5s;
    cursor:pointer;
}

.card.flipped{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    backface-visibility:hidden;
    font-size:2rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.card-back{
    background:linear-gradient(
        135deg,
        #1e293b,
        #0f172a
    );
    border:2px solid #38bdf8;
    color:#38bdf8;
    font-size:2rem;
    font-weight:bold;
}

.card-front{
    background:#334155;
    border:2px solid #64748b;
    transform:rotateY(180deg);
}

.card.matched{
    box-shadow:
        0 0 20px #4ade80,
        0 0 40px #4ade80;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
}

.modal-content{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    border:2px solid #38bdf8;
    box-shadow:0 0 30px rgba(56,189,248,0.5);
}

.modal h2{
    color:#4ade80;
    margin-bottom:15px;
}

.modal p{
    color:#cbd5e1;
}

.modal button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    color:#0f172a;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.modal button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #38bdf8;
}

@media(max-width:700px){

    .grid-4x4{
        grid-template-columns:repeat(4,70px);
    }

    .grid-6x4{
        grid-template-columns:repeat(4,70px);
    }

    .card{
        width:70px;
        height:70px;
    }

    .card-face{
        font-size:1.5rem;
    }
}

    </style>
</head>
<body>

    <header>
        <h1>Memory Space</h1>
        <p>Match all cards and unlock new levels!</p>
    </header>

    <div class="stats-panel">
        <div>
            Level:
            <span id="level-display" class="highlight">
                1
            </span>
        </div>

        <div>
            Moves:
            <span id="moves-display" class="highlight">
                0
            </span>
        </div>
    </div>

    <div id="grid" class="game-grid grid-4x4"></div>

    <div class="modal" id="level-modal">
        <div class="modal-content">
            <h2>Level Cleared!</h2>

            <p>
                Great job! Get ready for the next level.
            </p>

            <button onclick="advanceGame()">
                Next Level
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
